# Application configuration. Fields go here as Config grows.
app:
  name: master_harness
  w: 1024
  h: 768
  bg: "#1B2636"
version: 0.0.1
log_level: info # debug | info | warn | error

session:
  heartbeat_timeout: 30m
  heartbeat_scan_interval: 1m
  agent_heartbeat_interval: 1m

approval_broker:
  timeout: 30m

agent_manager:
  freeze_timeout: 5m
  allowed_agent_context_window: 200000
  connectivity_probe_url: https://api.anthropic.com
  connectivity_cache_ttl: 15s

mcp_servers:
  auth_timeout: 5m
  client_name: master_harness
  callback_path: /callback
  shutdown_grace: 2s
  verifier_bytes: 32
  state_bytes: 16
  min_verifier_bytes: 32 # rfc 7636 floor
  min_state_bytes: 16
  default_token_ttl: 1h
  challenge_method: S256
  supported_challenge_method: S256 # the only method implemented; anything else is rejected at startup
  supported_servers:
    atlassian:
      name: atlassian
      url: https://idontknowhowto
      auth_key_name: ATLASSIAN_OAUTH_SECRET
  encode_key: sk-abcxyz

agent_harness:
  claude_code:
    name: Claude Code
    bin_name: claude_code
    release_base: https://downloads.claude.ai/claude-code-releases
    login_timeout: 5m
    token_regex: sk-ant-oat[0-9]{2}-[A-Za-z0-9_-]{20,}
    ansi_regex: \x1b\[[0-9;?]*[a-zA-Z]
    max_instance: 3
    enabled_models:
      - fable
      - opus
      - sonnet
      - haiku

  open_code:
    name: Open Code
    bin_name: opencode
    release_base: https://api.github.com/repos/anomalyco/opencode
    login_timeout: 5m
    max_instance: 3
    enabled_models:
      - opencode/deepseek-v4-flash-free
